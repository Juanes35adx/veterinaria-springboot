      tags:
      - Veterinarios
      summary: Obtener veterinario por id
      operationId: obtenerVeterinario
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Veterinario"
        "401":
          description: Falta el token o es invalido o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
        "404":
          description: El recurso o uno de los que referencia no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
      security:
      - bearerAuth: []
    put:
      tags:
      - Veterinarios
      summary: Actualizar veterinario
      operationId: actualizarVeterinario
      parameters:
