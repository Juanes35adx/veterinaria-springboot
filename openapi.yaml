            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
        "401":
          description: Falta el token o es invalido o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
        "403":
          description: El rol del usuario no tiene permiso sobre esta ruta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
        "404":
          description: El recurso o uno de los que referencia no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
      security:
      - bearerAuth: []
    delete:
