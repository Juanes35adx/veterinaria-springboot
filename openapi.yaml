openapi: 3.1.0
info:
  title: ProtoZOO - API de gestion veterinaria
  description: "Clientes, mascotas, veterinarios, farmacia, consultas, diagnosticos\
    \ y recetas. Todas las rutas, salvo el login, exigen un token JWT en la cabecera\
    \ Authorization."
