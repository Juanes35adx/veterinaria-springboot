components:
  schemas:
    Veterinario:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        tarjetaProfesional:
          type: string
        especialidad:
          type: string
        telefono:
          type: string
        email:
          type: string
    Medicamento:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        principioActivo:
          type: string
        presentacion:
          type: string
        precio:
          type: number
          format: double
        stock:
          type: integer
          format: int32
        stockMinimo:
          type: integer
          format: int32
    Cliente:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        telefono:
          type: string
        email:
          type: string
    Mascota:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        especie:
          type: string
        raza:
          type: string
        edad:
          type: integer
          format: int32
        cliente:
          $ref: "#/components/schemas/Cliente"
    ConsultaMedica:
      type: object
      properties:
        id:
          type: integer
          format: int64
        mascota:
          $ref: "#/components/schemas/Mascota"
        veterinario:
          $ref: "#/components/schemas/Veterinario"
        fechaHora:
          type: string
          format: date-time
        motivo:
          type: string
        pesoKg:
          type: number
          format: double
        temperaturaC:
          type: number
          format: double
        observaciones:
          type: string
    Diagnostico:
      type: object
      properties:
        id:
          type: integer
          format: int64
        consulta:
          $ref: "#/components/schemas/ConsultaMedica"
        descripcion:
          type: string
        gravedad:
          type: string
        tratamiento:
          type: string
    Usuario:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        password:
          type: string
          writeOnly: true
        rol:
          type: string
          enum:
          - ADMIN
          - VETERINARIO
          - RECEPCIONISTA
        nombreCompleto:
          type: string
    Prescripcion:
      type: object
      properties:
        id:
          type: integer
          format: int64
        consulta:
          $ref: "#/components/schemas/ConsultaMedica"
        medicamento:
          $ref: "#/components/schemas/Medicamento"
        dosis:
          type: string
        duracion:
          type: string
        cantidad:
          type: integer
          format: int32
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        username:
          type: string
        rol:
          type: string
        nombreCompleto:
          type: string
        expiraEnMs:
          type: integer
          format: int64
    ErrorRespuesta:
      type: object
      description: Cuerpo de todas las respuestas de error
      properties:
        timestamp:
          type: string
          example: 2026-11-05T18:30:00
        status:
          type: integer
          format: int32
          example: 404
        error:
          type: string
          example: Not Found
        message:
          type: string
          example: Cliente no encontrado con id 99
  securitySchemes:
    bearerAuth:
      type: http
      description: Token obtenido en POST /api/auth/login
      scheme: bearer
      bearerFormat: JWT
