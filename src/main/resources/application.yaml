spring:
  application:
    name: veterinaria

  # --- Base de datos real: PostgreSQL, se ejecuta aparte del backend ---
  # Las credenciales no se versionan: DB_USERNAME y DB_PASSWORD deben
  # definirse como variables de entorno antes de arrancar (ver README).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/VeterinariaS}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # --- JPA / Hibernate ---
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

# --- Documentacion OpenAPI: /v3/api-docs y Swagger UI en /swagger-ui.html ---
springdoc:
  default-produces-media-type: application/json

# --- Seguridad: firma de los tokens JWT ---
# La clave se lee de la variable de entorno JWT_SECRET; el valor por defecto
# es solo para desarrollo local. En un despliegue real debe definirse la
# variable con un secreto propio y no publicado.
jwt:
  secret: ${JWT_SECRET:clave-de-desarrollo-para-firmar-tokens-jwt-veterinaria-upb-2026}
  # 8 horas, expresadas en milisegundos
  expiracion-ms: 28800000
