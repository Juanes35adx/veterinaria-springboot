spring:
  application:
    name: farmacia-inventario

  # --- Base de datos H2 en memoria ---
  datasource:
    url: jdbc:h2:mem:farmaciadb
    driver-class-name: org.h2.Driver
    username: sa
    password: ''

  # --- JPA / Hibernate ---
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  # --- Consola web de H2: http://localhost:8080/h2-console ---
  h2:
    console:
      enabled: true
      path: /h2-console
