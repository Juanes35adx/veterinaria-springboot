spring:
  application:
    name: veterinaria

  datasource:
    url: jdbc:h2:mem:veterinaria;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: 
  expiracion-ms: 28800000