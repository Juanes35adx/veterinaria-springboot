spring:
  application:
    name: veterinaria

  # --- Solo para tests: H2 en memoria. No toca la base Postgres real. ---
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ''

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

# Clave de firma solo para los tests.
jwt:
  secret: clave-exclusiva-para-tests-automatizados-de-veterinaria-2026
  expiracion-ms: 3600000
